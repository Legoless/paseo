pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    - name: typecheck
      # Merge commits can have no staged diff; still validate the merged tree.
      files: git ls-files
      run: |
        set -e
        if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
          git diff --exit-code
          npm run check:merge
          git diff --exit-code
        else
          npm run typecheck
        fi

pre-merge-commit:
  jobs:
    - name: merge-check
      run: |
        set -e
        git diff --exit-code
        npm run check:merge
        git diff --exit-code
